            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 24px;
            padding: 36px 24px;
            max-width: 380px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        }
        .avatar-container {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            margin: 0 auto 16px;
            overflow: hidden;
            border: 2px solid #374151;
            background: #1f2937;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .avatar-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        h1 {
            color: #f9fafb;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 6px;
        }
        p.subtitle {
            color: #9ca3af;
            font-size: 14px;
            margin-bottom: 28px;
        }
        .links {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            text-decoration: none;
            padding: 14px 20px;
            border-radius: 14px;
            font-weight: 600;
            font-size: 15px;
            transition: transform 0.15s ease, opacity 0.15s ease;
        }
        .btn:active {
            transform: scale(0.97);
        }
        .btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }
        .btn-tg {
            background: #229ed9;
            color: #ffffff;
        }
        .btn-tg:hover {
            opacity: 0.9;
        }
        .btn-twitch {

        }
        .btn-twitch:hover {

        }
        .btn-discord {
