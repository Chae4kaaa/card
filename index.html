<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Гнездо Чайки</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#050914">
    <meta property="og:title" content="chae4ka">
    <meta property="og:description" content="links">
    <meta property="og:type" content="website">
    <style>
        :root {
            --bg: #050914;
            --card: rgba(14, 20, 36, 0.72);
            --line: rgba(255, 255, 255, 0.09);
            --text: #f3f6fb;
            --muted: #8f9bb3;
            --glow-a: #38bdf8;
            --glow-b: #8b5cf6;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { -webkit-text-size-adjust: 100%; }
        body {
            background: radial-gradient(ellipse at 50% 0%, #0f1b3d 0%, var(--bg) 60%) fixed;
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: max(20px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
            overflow-x: hidden;
        }

        #stars { position: fixed; inset: 0; width: 100%; height: 100%; z-index: -1; }

        .card {
            position: relative;
            overflow: hidden;
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(3px) saturate(1.4);
            -webkit-backdrop-filter: blur(3px) saturate(1.4);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 30px;
            padding: 36px 20px 22px;
            text-align: center;
            box-shadow: 0 30px 60px -24px rgba(0, 0, 0, 0.7);
        }

        .card > * { position: relative; z-index: 1; }

        .avatar-wrap {
            position: relative;
            width: 108px; height: 108px;
            border-radius: 50%;
            padding: 3px;
            background: conic-gradient(from 0deg, var(--glow-a), var(--glow-b), #14b8a6, var(--glow-a));
            animation: spin 10s linear infinite;
        }
        .avatar-wrap .avatar {
            width: 100%; height: 100%; border-radius: 50%; overflow: hidden;
            background: #111827; border: 3px solid #0b1020;
            animation: spin 10s linear infinite reverse;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }

        .float { width: 108px; margin: 0 auto 18px; }

        .card { animation: cardIn .8s cubic-bezier(.2, .8, .2, 1) both; }
        @keyframes cardIn { from { opacity: 0; transform: translateY(24px) scale(.96); } to { opacity: 1; transform: none; } }

        h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.6px; }

        .ch { display: inline-block; opacity: 0; transform: translateY(16px) scale(.7); animation: chIn .55s cubic-bezier(.2, .9, .3, 1.5) forwards; animation-delay: calc(var(--i) * 70ms + 250ms); }
        @keyframes chIn { to { opacity: 1; transform: none; } }
        .subtitle { color: var(--muted); font-size: 14px; margin: 4px 0 26px; }

        .links { display: flex; flex-direction: column; gap: 10px; }

        .btn {
            --c: #fff;
            position: relative;
            display: flex;
            align-items: center;
            gap: 14px;
            text-decoration: none;
            color: var(--text);
            padding: 10px 14px 10px 10px;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.13);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14);
            font-weight: 600;
            font-size: 16px;
            text-align: left;
            transition: transform .2s ease, background .2s ease, border-color .2s ease, box-shadow .2s ease;
            opacity: 0;
            transform: translateY(12px);
            animation: rise .5s ease forwards;
            -webkit-tap-highlight-color: transparent;
        }
        .btn:nth-child(1) { --n: 0; animation-delay: .50s; }
        .btn:nth-child(2) { --n: 1; animation-delay: .58s; }
        .btn:nth-child(3) { --n: 2; animation-delay: .66s; }
        .btn:nth-child(4) { --n: 3; animation-delay: .74s; }
        .btn:nth-child(5) { --n: 4; animation-delay: .82s; }
        .btn:nth-child(6) { --n: 5; animation-delay: .90s; }
        .btn:nth-child(7) { --n: 6; animation-delay: .98s; }
        @keyframes rise { to { opacity: 1; transform: none; } }

        .btn { overflow: hidden; }

        .rip {
            position: absolute; width: 22px; height: 22px; border-radius: 50%; pointer-events: none;
            background: rgba(255, 255, 255, .3);
            transform: translate(-50%, -50%) scale(0);
            animation: rip .65s ease-out forwards;
        }
        @keyframes rip { to { transform: translate(-50%, -50%) scale(16); opacity: 0; } }

        .btn .ico {
            width: 42px; height: 42px; flex-shrink: 0;
            display: grid; place-items: center;
            border-radius: 13px;
            background: var(--c);
            box-shadow: 0 4px 10px -4px var(--c);
        }
        .btn .ico img { width: 22px; height: 22px; display: block; }
        .btn .label { flex: 1; min-width: 0; }
        .btn .arrow {
            width: 18px; height: 18px; flex-shrink: 0; opacity: .35;
            transition: transform .2s ease, opacity .2s ease;
        }
        .btn:hover, .btn:focus-visible {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.08);
            border-color: color-mix(in srgb, var(--c) 60%, transparent);
            box-shadow: 0 10px 28px -10px var(--c);
            outline: none;
        }
        .btn:hover .arrow, .btn:focus-visible .arrow { opacity: .9; transform: translateX(3px); }
        .btn:active { transform: scale(0.98); }

        .btn-tg      { --c: #229ed9; }
        .btn-discord { --c: #5865f2; }
        .btn-steam   { --c: #1b2838; }
        .btn-github  { --c: #2b3137; }
        .btn-tiktok  { --c: #111111; }
        .btn-tiktok .ico { box-shadow: none; border: 1px solid rgba(255, 255, 255, 0.12); }
        .btn-tiktok:hover, .btn-tiktok:focus-visible { box-shadow: 0 10px 28px -10px rgba(255, 255, 255, .25); border-color: rgba(255, 255, 255, .35); }
        .btn-youtube { --c: #ff0033; }
        .btn-twitch  { --c: #9146ff; }

        .foot { margin-top: 20px; font-size: 12px; color: var(--muted); opacity: .7; letter-spacing: .04em; }

        @media (prefers-reduced-motion: reduce) {
            .avatar-wrap, .avatar-wrap .avatar, .card { animation: none; }
            .ch { animation: none; opacity: 1; transform: none; }
            .btn { animation: none; opacity: 1; transform: none; }
            .rip { display: none; }
        }
    </style>
</head>
<body>

<canvas id="stars" aria-hidden="true"></canvas>

<main class="card">
    <div class="float">
        <div class="avatar-wrap">
            <div class="avatar">
                <img src="https://i.pinimg.com/736x/94/83/49/948349a8bef72d7a88fc279ee26f819d.jpg" alt="chae4ka">
            </div>
        </div>
    </div>

    <h1 id="name" aria-label="Chae4ka">Chae4ka</h1>
    <p class="subtitle">Сылочки</p>

    <div class="links">
        <a href="https://t.me/Chaykovni" class="btn btn-tg" target="_blank" rel="noopener noreferrer">
            <span class="ico"><img src="https://cdn.simpleicons.org/telegram/white" alt=""></span>
            <span class="label">Telegram</span>
            <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </a>

        <a href="https://discord.com/users/713749515500257314" class="btn btn-discord" target="_blank" rel="noopener noreferrer">
            <span class="ico"><img src="https://cdn.simpleicons.org/discord/white" alt=""></span>
            <span class="label">Discord</span>
            <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </a>

        <a href="https://steamcommunity.com/id/chae4kaa" class="btn btn-steam" target="_blank" rel="noopener noreferrer">
            <span class="ico"><img src="https://cdn.simpleicons.org/steam/white" alt=""></span>
            <span class="label">Steam</span>
            <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </a>

        <a href="https://github.com/Chae4kaaa" class="btn btn-github" target="_blank" rel="noopener noreferrer">
            <span class="ico"><img src="https://cdn.simpleicons.org/github/white" alt=""></span>
            <span class="label">GitHub</span>
            <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </a>

        <a href="https://www.tiktok.com/@_chae4ka_" class="btn btn-tiktok" target="_blank" rel="noopener noreferrer">
            <span class="ico"><img src="https://cdn.simpleicons.org/tiktok/white" alt=""></span>
            <span class="label">TikTok</span>
            <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </a>

        <a href="https://www.youtube.com/@_Chae4ka_" class="btn btn-youtube" target="_blank" rel="noopener noreferrer">
            <span class="ico"><img src="https://cdn.simpleicons.org/youtube/white" alt=""></span>
            <span class="label">YouTube</span>
            <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </a>

        <a href="https://www.twitch.tv/Chae4kaaaa" class="btn btn-twitch" target="_blank" rel="noopener noreferrer">
            <span class="ico"><img src="https://cdn.simpleicons.org/twitch/white" alt=""></span>
            <span class="label">Twitch</span>
            <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </a>
    </div>

    <p class="foot">Гнездо Чайки</p>
</main>

<script>
(function () {
    var cv = document.getElementById('stars');
    var cx = cv.getContext('2d');
    var stars = [], shots = [], nextShot = 2.5, w = 0, h = 0, dpr = Math.min(window.devicePixelRatio || 1, 2);
    var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

    function make() {
        var n = Math.round(Math.min(220, Math.max(90, (w * h) / 5500)));
        stars = [];
        for (var i = 0; i < n; i++) {
            var depth = Math.random();
            stars.push({
                x: Math.random() * w,
                y: Math.random() * h,
                r: 0.7 + depth * 1.5,
                v: 5 + depth * 16,
                a: 0.45 + depth * 0.55,
                tw: Math.random() * Math.PI * 2
            });
        }
    }
    function size() {
        w = window.innerWidth; h = window.innerHeight;
        cv.width = w * dpr; cv.height = h * dpr;
        cx.setTransform(dpr, 0, 0, dpr, 0, 0);
        make();
        draw(0);
    }
    function draw(dt) {
        cx.clearRect(0, 0, w, h);
        for (var i = 0; i < stars.length; i++) {
            var s = stars[i];
            s.y += s.v * dt;
            s.tw += dt * 1.5;
            if (s.y > h + 2) { s.y = -2; s.x = Math.random() * w; }
            var a = s.a * (0.75 + 0.25 * Math.sin(s.tw));
            cx.globalAlpha = a;
            cx.fillStyle = '#dfe9ff';
            cx.beginPath();
            cx.arc(s.x, s.y, s.r, 0, 6.2832);
            cx.fill();
        }
        cx.globalAlpha = 1;

        nextShot -= dt;
        if (dt > 0 && nextShot <= 0) {
            nextShot = 4 + Math.random() * 5;
            shots.push({ x: Math.random() * w * 0.9 + w * 0.1, y: -10, vx: -(180 + Math.random() * 120), vy: 260 + Math.random() * 140, life: 0 });
        }
        for (var j = shots.length - 1; j >= 0; j--) {
            var p = shots[j];
            p.life += dt; p.x += p.vx * dt; p.y += p.vy * dt;
            var len = 0.12, fade = Math.max(0, 1 - p.life / 1.6);
            var g = cx.createLinearGradient(p.x, p.y, p.x - p.vx * len, p.y - p.vy * len);
            g.addColorStop(0, 'rgba(255,255,255,' + (0.9 * fade) + ')');
            g.addColorStop(1, 'rgba(255,255,255,0)');
            cx.strokeStyle = g; cx.lineWidth = 1.6; cx.lineCap = 'round';
            cx.beginPath(); cx.moveTo(p.x, p.y); cx.lineTo(p.x - p.vx * len, p.y - p.vy * len); cx.stroke();
            if (p.life > 1.6 || p.y > h + 20) shots.splice(j, 1);
        }
    }
    var last = performance.now();
    function loop(now) {
        var dt = Math.min(0.05, (now - last) / 1000);
        last = now;
        draw(dt);
        requestAnimationFrame(loop);
    }
    window.addEventListener('resize', size);
    size();
    if (!reduce) requestAnimationFrame(loop);

    var name = document.getElementById('name');
    if (name && !reduce) {
        var t = name.textContent;
        name.textContent = '';
        for (var k = 0; k < t.length; k++) {
            var s = document.createElement('span');
            s.className = 'ch'; s.setAttribute('aria-hidden', 'true');
            s.style.setProperty('--i', k);
            s.textContent = t[k];
            name.appendChild(s);
        }
    }

    var btns = document.querySelectorAll('.btn');
    for (var b = 0; b < btns.length; b++) {
        btns[b].addEventListener('pointerdown', function (e) {
            if (navigator.vibrate) { try { navigator.vibrate(10); } catch (err) {} }
            if (reduce) return;
            var r = this.getBoundingClientRect();
            var d = document.createElement('span');
            d.className = 'rip';
            d.style.left = (e.clientX - r.left) + 'px';
            d.style.top = (e.clientY - r.top) + 'px';
            this.appendChild(d);
            setTimeout(function () { d.remove(); }, 700);
        });
    }
})();
</script>

</body>
</html>
