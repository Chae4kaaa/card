<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Гнездо Чайки</title>

    <meta name="robots" content="noindex, nofollow">

    <meta property="og:title" content="chae4ka">
    <meta property="og:description" content="Contact Card & Socials">
    <meta property="og:type" content="website">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 20px;
            padding: 32px 24px;
            max-width: 380px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        .avatar-container {
            width: 88px;
            height: 88px;
            border-radius: 50%;
            background: linear-gradient(135deg, #1f6feb, #238636);
            margin: 0 auto 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            border: 2px solid #30363d;
        }
        h1 {
            color: #f0f6fc;
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 6px;
        }
        p.subtitle {
            color: #8b949e;
            font-size: 13px;
            margin-bottom: 24px;
        }
        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: #21262d;
            border: 1px solid #30363d;
            color: #c9d1d9;
            text-decoration: none;
            padding: 14px 20px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.2s ease;
        }
        .btn:hover {
            background: #30363d;
            border-color: #8b949e;
            color: #ffffff;
        }
        .btn-tg {
            background: #2481cc;
            border-color: #2481cc;
            color: #ffffff;
        }
        .btn-tg:hover {
            background: #1a6cb0;
            border-color: #1a6cb0;
        }
        .btn-twitch {
            background: #9146ff;
            border-color: #9146ff;
            color: #ffffff;
        }
        .btn-twitch:hover {
            background: #772ce8;
            border-color: #772ce8;
        }
        .btn-discord {
            background: #5865F2;
            border-color: #5865F2;
            color: #ffffff;
        }
        .btn-discord:hover {
            background: #4752C4;
            border-color: #4752C4;
        }
        .discord-box {
            background: #161b22;
            border: 1px dashed #30363d;
            color: #8b949e;
            font-size: 13px;
            padding: 10px;
            border-radius: 10px;
            margin-top: 4px;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="avatar-container">🦅</div>
    <h1>chae4ka</h1>
    <p class="subtitle">Прогрев Хамамов</p>

    <div class="links">
        <a href="https://t.me/chae4ka" class="btn btn-tg" target="_blank">
            Telegram
        </a>

        <a href="https://www.twitch.tv/chae4ka" class="btn btn-twitch" target="_blank">
            Twitch
        </a>
      
        <a href="https://discord.com/users/713749515500257314" class="btn btn-discord" target="_blank">
            Discord
        </a>
    </div>
</div>

</body>
</html>
